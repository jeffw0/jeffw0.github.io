<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jeffrey Wu - Home</title>
  <link rel="stylesheet" href="common.css" />
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="manifest" href="/site.webmanifest" />
  <style>
    .home-hero {display:flex;align-items:center;justify-content:center;height:85vh;flex-direction:column;text-align:center;padding:24px}
    .home-buttons {display:flex;gap:20px;margin-top:24px;flex-wrap:wrap}
    .big-btn {padding:20px 36px;font-size:1.25rem;border-radius:10px;cursor:pointer;text-decoration:none}
    .big-btn.primary {background:#0ea5e9;color:#fff}
    .big-btn.secondary {background:#111827;color:#fff}
    .inline-link { color: #0ea5e9; text-decoration: underline; text-underline-offset: 2px; font-weight:500 }
  </style>
</head>
<body>
  <main>
    <section class="home-hero">
      <h1 style="font-size:2rem;margin:0">Welcome to Jeffrey Wu's Personal Site!</h1>
      <p style="margin-top:8px;opacity:0.85">Recent IT Graduate • System Admin • Backend Developer</p>
      <div class="home-buttons">
        <a class="big-btn primary" href="/info.html">About Me</a>
        <a class="big-btn secondary" href="/projects.html">Projects</a>
      </div>
      <p style="margin-top:18px;font-size:0.9rem;color:#666">Or jump straight to <a href="/info.html#contact" class="inline-link">resume & contact info</a>.</p>
    </section>
  </main>

  <footer style="text-align:center;padding:16px 0;color:#777">
    <small>&copy; <span id="year"></span> Jeffrey Wu</small>
  </footer>

  <script>document.getElementById('year').textContent=new Date().getFullYear();</script>
</body>
</html>
